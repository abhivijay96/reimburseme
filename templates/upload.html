{% extends "base.html" %}
{% block title %}Upload Trip Files{% endblock %}
{% block content %}
<h1>Upload Trip Files</h1>

{% if error %}
<div class="error-message">{{ error }}</div>
{% endif %}

<form method="POST" enctype="multipart/form-data" class="form-grid" id="uploadForm">
    <div class="form-group">
        <label for="trip_name">Trip Name:</label>
        <input class="form-input" type="text" name="trip_name" required>
    </div>

    <div class="form-group">
        <label for="file">Select files:</label>
        <div id="drop-area" class="drop-area">
            <p>Drag & drop files here or click to select</p>
            <input id="fileElem" type="file" name="file" multiple accept=".pdf,.png,.jpg,.jpeg" class="form-input hidden">
        </div>
        <div id="file-list" class="file-list"></div>
    </div>

    <div class="form-group">
        <button class="btn btn-primary" type="submit">
            Upload
        </button>
    </div>
</form>

<style>
    .drop-area {
        border: 2px dashed #ccc;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        background-color: #f9f9f9;
    }

    .drop-area.hover {
        border-color: #333;
        background-color: #eee;
    }

    .file-list {
        margin-top: 10px;
    }

    .file-list p {
        margin: 0;
        font-size: 0.9em;
    }

    .hidden {
        display: none;
    }
</style>

<script>
    const dropArea = document.getElementById('drop-area');
    const fileElem = document.getElementById('fileElem');
    const fileList = document.getElementById('file-list');
    let filesToUpload = [];

    dropArea.addEventListener('click', () => fileElem.click());

    fileElem.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    dropArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropArea.classList.add('hover');
    });

    dropArea.addEventListener('dragleave', () => {
        dropArea.classList.remove('hover');
    });

    dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.classList.remove('hover');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        for (let file of files) {
            filesToUpload.push(file);
        }
        updateFileList();
    }

    function updateFileList() {
        fileList.innerHTML = '';
        filesToUpload.forEach((file, index) => {
            const fileItem = document.createElement('p');
            fileItem.textContent = `${index + 1}. ${file.name}`;
            fileList.appendChild(fileItem);
        });

        // Rebuild the file input to include all selected files
        const dataTransfer = new DataTransfer();
        filesToUpload.forEach(file => dataTransfer.items.add(file));
        fileElem.files = dataTransfer.files;
    }
</script>
{% endblock %}
